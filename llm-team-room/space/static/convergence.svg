<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">Zyntalic Convergence</title>
  <desc id="desc">A luminous language signal formed from orbital rings, glyphs, wave bands, and expanding fragments.</desc>
  <defs>
    <linearGradient id="orbit" x1="25" y1="12" x2="101" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="signal" x1="32" y1="76" x2="96" y2="118" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#243b76" stop-opacity=".45"/>
      <stop offset="1" stop-color="#080910" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="waves" width="12" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 3 1l3 2 3 2 3-2" fill="none" stroke="url(#signal)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="128" height="128" rx="24" fill="#080910"/>
  <circle cx="63" cy="48" r="47" fill="url(#halo)"/>

  <g fill="none" stroke="url(#orbit)" stroke-linecap="round">
    <circle cx="63" cy="48" r="32" stroke-width=".75" opacity=".4"/>
    <circle cx="63" cy="48" r="25" stroke-width=".95" opacity=".52"/>
    <ellipse cx="63" cy="48" rx="18" ry="43" stroke-width="1.35" transform="rotate(-18 63 48)"/>
    <ellipse cx="63" cy="48" rx="24" ry="44" stroke-width="1.1" transform="rotate(31 63 48)" opacity=".95"/>
    <ellipse cx="63" cy="48" rx="41" ry="21" stroke-width=".85" transform="rotate(-12 63 48)" opacity=".76"/>
    <ellipse cx="63" cy="48" rx="39" ry="28" stroke-width=".7" transform="rotate(21 63 48)" opacity=".55"/>
    <path d="M18 55c8-25 27-40 49-42 25-2 41 14 44 36 3 21-9 35-28 39" stroke-width=".6" opacity=".42"/>
  </g>

  <g fill="#080910" stroke="url(#orbit)">
    <g transform="translate(52 24)"><ellipse rx="5.6" ry="3.8"/><ellipse rx="3.5" ry="2.3" stroke-width=".7"/></g>
    <g transform="translate(72 39)"><circle r="5.2"/><circle r="3.1" stroke-width=".7"/></g>
    <g transform="translate(54 57)"><ellipse rx="5.5" ry="4.1"/></g>
    <g transform="translate(68 72)"><ellipse rx="5" ry="3.4"/><ellipse rx="3.1" ry="2" stroke-width=".65"/></g>
  </g>

  <g fill="none" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="m40 31 5-4-1 7 5-1"/>
    <path d="m57 39 4-5 3 1-4 3 3 1-5 5"/>
    <path d="m82 31 6 1-1 6-5-6 6 6"/>
    <path d="m48 47 7 7m0-8-8 8h10"/>
    <path d="m69 51 7 1-2 7-5-5"/>
  </g>

  <rect x="34" y="76" width="58" height="15" fill="url(#waves)"/>
  <path d="M34 75c4 3 7-3 11 0s7-3 11 0 7-3 11 0 7-3 11 0 7-3 11 0" fill="none" stroke="#8b5cf6" stroke-width="1.1"/>

  <g fill="none" stroke="url(#signal)" stroke-linecap="round">
    <path d="M43 96q20 5 41 0" stroke-width="1.1"/>
    <path d="M35 103q28 7 57 0" stroke-width=".9" opacity=".9"/>
    <path d="M26 110q37 8 75 0" stroke-width=".8" opacity=".72"/>
  </g>

  <g fill="none" stroke="url(#signal)" stroke-width="1" stroke-linecap="round">
    <path d="m48 99 2 3 2-1m21-3 3 1-1-3m-35 10 1 4 3-1m17-5-2 4 4 1m19-4 4-2m-56 10 3 4-1-5m20 2 2 4m13-6-1 5 4-2m19-2 3 3-4 1"/>
  </g>
</svg>
