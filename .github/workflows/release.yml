name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches project version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag '$tag' does not match pyproject version '$version' (expected 'v$version')." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - name: Build sdist and wheel
        run: |
          python -m pip install -U pip build
          python -m build

      - name: Verify wheel installs and runs standalone
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install -q dist/zyntalic-*.whl
          # Run outside the source tree so packaged lexicon resources are exercised.
          cd /tmp
          PYTHONIOENCODING=utf-8 /tmp/verify/bin/python -c "
          from zyntalic.translator import translate_sentence
          row = translate_sentence('I see the river at night.', engine='core', mirror_rate=0.3)
          assert row['target'].strip(), 'empty translation from installed wheel'
          print('wheel smoke test:', row['target'])
          "
          PYTHONIOENCODING=utf-8 /tmp/verify/bin/zyntalic translate "The river runs." --format plain

      - uses: actions/upload-artifact@v4
        with:
          name: zyntalic-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: zyntalic-dist
          path: dist

      - name: Create release with distributions attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "Zyntalic $TAG" \
            --generate-notes \
            --verify-tag
