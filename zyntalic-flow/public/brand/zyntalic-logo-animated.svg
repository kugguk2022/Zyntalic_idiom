<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="za-motion-title za-motion-desc">
  <title id="za-motion-title">Zyntalic — Polyglot Arc, animated</title>
  <desc id="za-motion-desc">The complete Polyglot Arc mark stays visible while a highlight travels along the signal arc every six seconds. Reduced-motion preferences show the static mark.</desc>
  <defs>
    <linearGradient id="za-motion-spectrum" x1="79" y1="58" x2="199" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#4f7cff"/><stop offset="1" stop-color="#a078ff"/>
    </linearGradient>
    <linearGradient id="za-motion-arc" x1="45" y1="215" x2="214" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f7cff"/><stop offset=".56" stop-color="#22d3ee"/><stop offset="1" stop-color="#c2f7ff"/>
    </linearGradient>
  </defs>
  <style>
    .za-pulse { animation: za-transmit 6s linear infinite; }
    @keyframes za-transmit {
      0% { stroke-dashoffset: 18; opacity: 0; }
      8% { opacity: 1; }
      68% { opacity: 1; }
      82%, 100% { stroke-dashoffset: -100; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .za-pulse { animation: none; opacity: 0; }
    }
  </style>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#za-motion-spectrum)" stroke-width="3.7">
      <ellipse cx="137" cy="128" rx="33" ry="72" transform="rotate(-20 137 128)"/>
      <ellipse cx="137" cy="128" rx="72" ry="32" transform="rotate(-16 137 128)"/>
    </g>
    <path d="M46 216C33 115 88 45 214 42" stroke="url(#za-motion-arc)" stroke-width="5"/>
    <path d="m57 39 4-5 3 1-4 3 3 1-5 5" transform="translate(135 128) scale(4) translate(-60 -40)" stroke="#edfaff" stroke-width="1.45"/>
    <path d="M87 207c12-10 24 10 36 0s24-10 36 0 24 10 36 0" stroke="url(#za-motion-spectrum)" stroke-width="3"/>
    <path d="M102 220c12-7 24 7 36 0s24-7 36 0" stroke="url(#za-motion-spectrum)" stroke-width="2.5" opacity=".6"/>
    <path class="za-pulse" d="M46 216C33 115 88 45 214 42" pathLength="100" stroke="#f4ffff" stroke-width="6" stroke-dasharray="18 120" stroke-dashoffset="18" opacity="0"/>
  </g>
  <g fill="#a078ff">
    <path d="M211 35l16 6-16 7 4-7Z"/>
  </g>
  <g fill="#edfaff">
    <circle cx="111.8" cy="61.2" r="3.8"/>
    <circle cx="204.4" cy="110.9" r="3.8"/>
  </g>
  <g fill="none" stroke="#edfaff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="m40 31 5-4-1 7 5-1" transform="translate(84 80) scale(1.8) translate(-44 -31)"/>
    <path d="m82 31 6 1-1 6-5-6 6 6" transform="translate(176 50) scale(1.8) translate(-85 -34)"/>
  </g>
</svg>
